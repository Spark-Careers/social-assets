<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/base.css">
<style>
  body { background: var(--spark-arsenic); color: var(--text-light); }

  /* Top: badge + theme tag */
  .header {
    position: absolute;
    top: var(--pad);
    left: var(--pad);
    right: var(--pad);
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .badge {
    border: 2px solid var(--spark-cadet);
    color: var(--spark-cadet);
    padding: 12px 22px;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.08em;
  }
  .theme-tag {
    color: var(--spark-cadet);
    letter-spacing: 0.18em;
  }

  /* Overline ("THE INSIGHT") */
  .overline-label {
    position: absolute;
    top: 220px;
    left: var(--pad);
    color: rgba(255,255,255,0.5);
  }

  /* Headline */
  .body-area {
    position: absolute;
    top: 290px;
    left: var(--pad);
    right: var(--pad);
  }
  .body-area .headline { color: var(--text-light); }
  .body-area .headline .accent { color: var(--spark-cadet); }

  /* Bottom-right accent dots */
  .accent-dots {
    position: absolute;
    bottom: 230px;
    right: var(--pad);
    display: flex;
    gap: 10px;
  }
  .accent-dots .dot {
    width: 22px;
    height: 22px;
    background: var(--spark-cadet);
  }

  /* Footer */
  .logo-spark { width: 220px; }
  .footer-meta { color: rgba(255,255,255,0.55); }
  .footer-url { color: var(--spark-cadet); font-size: 24px; }
</style>
</head>
<body>
<div class="canvas">

  <div class="header">
    <div class="badge">{{BADGE_NUMBER}}</div>
    <div class="theme-tag overline">{{THEME_TAG}}</div>
  </div>

  <div class="overline-label overline" style="font-size:18px;">{{OVERLINE}}</div>

  <div class="body-area">
    <div class="headline">{{HEADLINE_HTML}}</div>
  </div>

  <div class="accent-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <img class="logo-spark cream" src="assets/spark-logo.png" alt="Spark Careers">
      <div class="footer-meta">{{FOOTER_META}}</div>
    </div>
    <div class="footer-right">
      <div class="footer-url">{{URL}}</div>
    </div>
  </div>

</div>
</body>
</html>
